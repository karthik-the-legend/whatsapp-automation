version: "3.9"

# Local dev only. Production Postgres/Redis come from Railway/Render per
# the hosting decision in docs/stack-rationale.md - this compose file just
# gets you running against real Postgres+Redis on your laptop from day one
# (avoids "works on SQLite, breaks on Postgres" surprises later).

services:
  postgres:
    image: postgres:16-alpine
    container_name: academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev_password
      POSTGRES_DB: academy_automation
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: academy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  pg-data:
  redis-data:
